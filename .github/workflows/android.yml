name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - run: npm ci

      - name: Generate web bundle
        run: node sync.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk aqil-computers.apk
          ls -lh aqil-computers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aqil-computers-apk
          path: aqil-computers.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aqil-computers.apk
          generate_release_notes: true
