const AVATAR_GRADIENTS = [
  ['#8ff9e9', '#2cc9b4'], ['#f8d68c', '#d99a1f'], ['#a9c8ff', '#4b83f0'],
  ['#d2b8ff', '#8b5cf6'], ['#ffb7c0', '#ef546b'], ['#a9f0bf', '#2eb85c'],
  ['#ffd0a3', '#e8833a'], ['#9fe8f7', '#2a9ec9']
];
function nameHash(name) {
  let h = 0;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function avatarStyle(name) {
  const p = AVATAR_GRADIENTS[nameHash(name) % AVATAR_GRADIENTS.length];
  return 'style="background:linear-gradient(145deg,' + p[0] + ',' + p[1] + ')"';
}
function avatarHTML(name, cls = '') {
  return '<div class="avatar ' + cls + '" ' + avatarStyle(name) + ' aria-hidden="true">' + esc(initials(name)) + '</div>';
}
function currencyChipButtons(active) {

function chartCard() {
  const days = lastDays(7);
  const sales = state.sales;
  const per = days.map((d) => {
    const list = sales.filter((s) => s.date === d.iso);
    return { ...d, rev: sum(list, (s) => s.totalPKR), pnl: sum(list, (s) => s.pnlPKR), count: list.length };
  });
  const max = Math.max(1, ...per.map((d) => Math.max(d.rev, Math.abs(d.pnl))));
  const revTotal = sum(per, (d) => d.rev);
  const pnlTotal = sum(per, (d) => d.pnl);
  const hasData = revTotal > 0 || per.some((d) => d.count > 0);
  return '<div class="card chart-card">' +
    '<div class="chart-top"><div><div class="sec-title">Sales <span class="k">last 7 days</span></div>' +
    '<div class="chart-total"><span class="big">' + money(revTotal) + '</span>' +
    '<span class="small">profit <span class="' + (pnlTotal >= 0 ? 'up' : 'down') + '">' + signedMoney(pnlTotal) + '</span></span></div></div>' +
    '<a class="link" href="#/sales">Stock out ' + icon('chevron-right') + '</a></div>' +
    (hasData
      ? '<div class="chart">' + per.map((d) => {
        const rh = d.rev > 0 ? Math.max(3, (d.rev / max) * 100) : 0;
        const ph = d.pnl !== 0 ? Math.max(2, (Math.abs(d.pnl) / max) * 100) : 0;
        return '<div class="bar-col' + (d.today ? ' today' : '') + '" title="' + fmtDate(d.iso) + ' — revenue ' + money(d.rev) + ', profit ' + signedMoney(d.pnl) + '">' +
          '<div class="bars"><i class="bar rev" style="height:' + rh + '%"></i>' +
          (ph ? '<i class="bar prof ' + (d.pnl < 0 ? 'neg' : '') + '" style="height:' + ph + '%"></i>' : '') + '</div>' +
          '<span class="lbl">' + d.label + '</span></div>';
      }).join('') + '</div>'
      : '<div class="empty mini" style="border:0;background:none;padding:24px 10px 20px">' +
        '<div class="e-ico">' + icon('activity') + '</div><h3>No sales in the last 7 days</h3>' +
        '<p>Record a sale and revenue will chart here.</p></div>') +
    '<div class="chart-legend"><span><i class="rev"></i> Revenue</span><span><i class="prof"></i> Profit</span>' +
    '<span class="note">' + (state.sales.length ? state.sales.length + ' sales all-time' : 'PKR') + '</span></div></div>';
}

/* ============================================================
   Updates
   - Web / PWA: the service worker refreshes the app files, so a
     normal restart picks up the new version.
   - Android (Capacitor): the native shell stores the new app file
     and swaps it in on the next start. Only native changes need a
     new APK, and then a download modal is shown.
   ============================================================ */
const UPDATE_STAMP_KEY = 'aqil_update_stamp_v1';
const APK_NOTICE_KEY = 'aqil_apk_notice_v1';
const UPDATE_EVERY = 6 * 60 * 60 * 1000;
let updateInfo = { checking: false, manifest: null, error: null, checkedAt: 0, ready: null };
let updateModalFor = '';

function cmpVersion(a, b) {
  const pa = String(a || '0').split(/[.+-]/).map((n) => parseInt(n, 10) || 0);
  const pb = String(b || '0').split(/[.+-]/).map((n) => parseInt(n, 10) || 0);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d > 0 ? 1 : -1;
  }
  return 0;
}

function nativeShell() {
  const s = window.__AQIL_SHELL__;
  return s && s.native ? s : null;
}

function updateManifestUrl() {
  const shell = nativeShell();
  if (shell && shell.manifestUrl) return shell.manifestUrl;
  return 'version.json';
}

function fetchText(url, ms) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => {
      settled = true;
      if (ctrl) { try { ctrl.abort(); } catch (e) { /* noop */ } }
      reject(new Error('timeout'));
    }, ms || 10000);
    const sep = url.indexOf('?') >= 0 ? '&' : '?';
    fetch(url + sep + 't=' + Date.now(), {
      cache: 'no-store',
      credentials: 'omit',
      signal: ctrl ? ctrl.signal : undefined
    }).then((res) => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then((text) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(text);
    }).catch((err) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(err);
    });
  });
}

function updateStamp() {
  try { return parseInt(localStorage.getItem(UPDATE_STAMP_KEY) || '0', 10) || 0; }
  catch (e) { return 0; }
}

function updateStatusText() {
  if (updateInfo.checking) return 'Checking…';
  if (updateInfo.error) return 'Could not check — are you online?';
  const shell = nativeShell();
  const parts = ['Version ' + APP_VERSION];
  if (shell) parts.push('app ' + shell.version);
  if (updateInfo.ready) return updateInfo.ready.version + ' downloaded · restart to finish';
  if (updateInfo.checkedAt || updateStamp()) return parts.join(' · ') + ' · up to date';
  return parts.join(' · ');
}

function updateInfoView() {
  const el = $('#upd-status');
  if (el) el.textContent = updateStatusText();
  const btn = $('#upd-check');
  if (btn) btn.disabled = updateInfo.checking;
}

async function checkForUpdates(opts) {
  const silent = !!(opts && opts.silent);
  if (updateInfo.checking) return updateInfo.manifest;
  updateInfo.checking = true;
  updateInfo.error = null;
  updateInfoView();
  if (!silent) toast('Checking for updates…', 'info');
  try {
    const raw = await fetchText(updateManifestUrl(), 10000);
    let man;
    try { man = JSON.parse(raw); } catch (e) { throw new Error('bad manifest'); }
    if (!man || !man.version) throw new Error('bad manifest');
    updateInfo.manifest = man;
    updateInfo.checkedAt = Date.now();
    try { localStorage.setItem(UPDATE_STAMP_KEY, String(updateInfo.checkedAt)); } catch (e) { /* noop */ }

    const shell = nativeShell();
    const needsApk = shell && man.shell && cmpVersion(man.shell, shell.version) > 0;

    if (needsApk) {
      let seen = '';
      try { seen = localStorage.getItem(APK_NOTICE_KEY) || ''; } catch (e) { /* noop */ }
      if (!silent || seen !== String(man.shell)) showApkModal(man);
      return man;
    }

    if (cmpVersion(man.version, APP_VERSION) > 0) {
      if (shell && typeof shell.applyUpdate === 'function') {
        if (!silent) toast('Downloading version ' + man.version + '…', 'info');
        let result = null;
        try { result = await shell.applyUpdate(man); } catch (e) { result = null; }
        if (result && result.ok) {
          updateInfo.ready = result;
          toast('Version ' + man.version + ' downloaded. Restart to finish.', 'ok');
          showRestartModal(man);
        } else if (!silent) {
          toast('Update download failed. Try again later.', 'err');
        }
      } else {
        showWebUpdateModal(man, silent);
      }
    } else if (!silent) {
      toast('You are on the latest version (' + APP_VERSION + ').', 'ok');
    }
    return man;
  } catch (err) {
    updateInfo.error = (err && err.message) || 'failed';
    if (!silent) toast('Could not check for updates. Check your connection.', 'err');
    return null;
  } finally {
    updateInfo.checking = false;
    updateInfoView();
  }
}

function notesBlock(man) {
  const notes = String((man && man.notes) || '').trim();
  if (!notes) return '';
  return '<div class="upd-notes">' +
    notes.split('\n').filter(Boolean).map((line) =>
      '<div class="upd-note">' + icon('check') + '<span>' + esc(line.replace(/^[-•]\s*/, '')) + '</span></div>').join('') +
    '</div>';
}

function apkUrlFor(man) {
  const shell = nativeShell();
  return (man && man.apk) || (shell && shell.apkUrl) || '';
}

function showApkModal(man) {
  try { localStorage.setItem(APK_NOTICE_KEY, String(man.shell || man.version)); } catch (e) { /* noop */ }
  updateModalFor = 'apk:' + man.shell;
  const url = apkUrlFor(man);
  openModal(modalShell({
    title: 'New app version required',
    sub: 'Version ' + esc(man.shell || man.version) + ' needs a fresh install.',
    cls: 'narrow upd-modal',
    body: '<div class="upd-hero">' + icon('download') + '</div>' +
      '<p class="upd-text">This release changes the Android app itself, so it cannot be applied inside the app. Download the APK and install it over the old one.</p>' +
      '<div class="upd-safe">' + icon('database') + '<span>Your stock, sales and accounts stay on this phone. Only the app is replaced.</span></div>' +
      notesBlock(man) +
      '<div class="upd-link"><span>' + esc(url) + '</span></div>',
    footer: '<button type="button" class="btn ghost" data-action="close-modal">Later</button>' +
      '<button type="button" class="btn primary" data-action="download-apk" data-url="' + esc(url) + '">' + icon('download') + ' Download APK</button>'
  }));
}

function showRestartModal(man) {
  updateModalFor = 'restart:' + man.version;
  openModal(modalShell({
    title: 'Update ready',
    sub: 'Version ' + esc(man.version) + ' is on this device.',
    cls: 'narrow upd-modal',
    body: '<div class="upd-hero ok">' + icon('check') + '</div>' +
      '<p class="upd-text">The new version is downloaded and will open the next time the app starts. Restart now to use it.</p>' +
      notesBlock(man),
    footer: '<button type="button" class="btn ghost" data-action="close-modal">Later</button>' +
      '<button type="button" class="btn primary" data-action="restart-app">' + icon('refresh') + ' Restart now</button>'
  }));
}

function showWebUpdateModal(man, quiet) {
  if (updateModalFor === 'web:' + man.version) return;
  updateModalFor = 'web:' + man.version;
  openModal(modalShell({
    title: 'Update available',
    sub: 'Version ' + esc(man.version) + ' is live on GitHub.',
    cls: 'narrow upd-modal',
    body: '<div class="upd-hero">' + icon('refresh') + '</div>' +
      '<p class="upd-text">Reload to load the new version. Your data is saved in this browser and will not be touched.</p>' +
      notesBlock(man) +
      '<div class="upd-link"><span>' + esc(man.bundleUrl || updateManifestUrl().replace(/version\.json.*$/, '')) + '</span></div>',
    footer: '<button type="button" class="btn ghost" data-action="close-modal">Later</button>' +
      '<button type="button" class="btn primary" data-action="reload-app">' + icon('refresh') + ' Reload now</button>'
  }));
}

function showUpdateSheet() {
  updateModalFor = '';
  const man = updateInfo.manifest;
  if (!man) { checkForUpdates({}); return; }
  const shell = nativeShell();
  if (shell && man.shell && cmpVersion(man.shell, shell.version) > 0) { showApkModal(man); return; }
  if (cmpVersion(man.version, APP_VERSION) > 0) {
    if (updateInfo.ready) showRestartModal(man);
    else showWebUpdateModal(man, false);
    return;
  }
  toast('You are on the latest version (' + APP_VERSION + ').', 'ok');
}

function openExternal(url) {
  if (!url) return;
  const plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  const browser = plugins.Browser;
  if (browser && typeof browser.open === 'function') {
    browser.open({ url }).catch(() => { window.location.href = url; });
    return;
  }
  const win = window.open(url, '_blank', 'noopener');
  if (!win) window.location.href = url;
}

async function reloadApp() {
  closeAllModals();
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    }
  } catch (e) { /* noop */ }
  location.reload();
}

function registerServiceWorker() {
  if (nativeShell()) return;
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      if (reg && reg.update) reg.update().catch(() => {});
    }).catch(() => {});
  } catch (e) { /* noop */ }
}

function bindAndroidBack() {
  const plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  const App = plugins.App;
  if (!App || typeof App.addListener !== 'function') return;
  App.addListener('backButton', () => {
    if (modalStack.length) { closeModal(); return; }
    const route = getRoute();
    if (route.view !== 'dashboard') { location.hash = '#/dashboard'; return; }
    if (typeof App.minimizeApp === 'function') App.minimizeApp();
    else if (typeof App.exitApp === 'function') App.exitApp();
  });
}

function initUpdates() {
  registerServiceWorker();
  bindAndroidBack();
  window.addEventListener('aqil:update-ready', (e) => {
    const detail = e.detail || {};
    if (!detail.version) return;
    updateInfo.ready = detail;
    updateInfoView();
    toast('Version ' + detail.version + ' downloaded. Restart to finish.', 'ok');
    if (dialogOpen()) return;
    showRestartModal(detail);
  });
  const wait = Date.now() - updateStamp() > UPDATE_EVERY ? 1600 : 5200;
  setTimeout(() => { if (navigator.onLine !== false) checkForUpdates({ silent: true }); }, wait);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - updateStamp() > UPDATE_EVERY) checkForUpdates({ silent: true });
  });
}

function dialogOpen() {
  return typeof modalStack !== 'undefined' && modalStack.length > 0;
}


/* ---------------- modal infrastructure ---------------- */
const modalStack = [];
function openModal(html, opts) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = html;
  $('#modal-root').appendChild(ov);
  modalStack.push({ ov });
  document.body.style.overflow = 'hidden';
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) closeModal(ov); });
  if (opts && opts.onMount) opts.onMount(ov);
  const focusable = ov.querySelector('.modal [data-autofocus]') ||
    ov.querySelector('.modal input:not([type=radio]):not([type=checkbox]):not([type=file]), .modal select, .modal textarea');
  if (focusable && window.matchMedia('(pointer:fine)').matches) {
    setTimeout(() => {
      try {
        focusable.focus({ preventScroll: true });
        if (typeof focusable.select === 'function' && /^(text|tel|number)$/.test(focusable.type)) focusable.select();
      } catch (e) { /* noop */ }
    }, 90);
  }
  return ov;
}
function closeModal(target) {
  let idx = modalStack.length - 1;
  if (target) idx = modalStack.findIndex((s) => s.ov === target);
  if (idx < 0) return;
  const [entry] = modalStack.splice(idx, 1);
  if (entry) entry.ov.remove();
  if (!modalStack.length) document.body.style.overflow = '';
}
function closeAllModals() {
  while (modalStack.length) closeModal();
}
function openConfirm(opts) {
  openModal(modalShell({
    title: opts.title,
    cls: 'narrow',
    body: '<div class="confirm-body">' + opts.body + (opts.warning ? '<div class="warn-box">' + opts.warning + '</div>' : '') + '</div>',
    footer: '<button type="button" class="btn ghost" data-action="close-modal">Cancel</button>' +
      '<button type="button" class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="confirm-go">' + esc(opts.cta || 'Confirm') + '</button>'
  }), {
    onMount(ov) {
      const go = ov.querySelector('#confirm-go');
      if (go) go.addEventListener('click', () => {
        closeModal(ov);
        if (opts.onConfirm) opts.onConfirm();
      });
    }
  });
}
function toast(msg, type) {
  const wrap = $('#toasts');
  if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'ok');
  t.innerHTML = icon(type === 'err' ? 'alert' : type === 'info' ? 'activity' : 'check') + '<div>' + msg + '</div>';
  wrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 220);
  }, 2900);
}
function formError(form, id, msg) {
  toast(msg, 'err');
  const field = form.querySelector('#' + id);
  if (field) {
    field.focus({ preventScroll: true });
    field.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

function currentDraftRates(form) {

function readItemInputs(form) {
  return {

function updateItemCalc(form) {
  if (!form) return;
  const raw = readItemInputs(form);

  set('o-air', money(calc.airPKR));
  set('o-sea', money(calc.seaPKR));

    ? '= <em>' + money(calc.packPKR) + '</em> total' + (raw.packingMode === 'unit' ? ' · ' + raw.units + ' × ' + money(raw.packing, 'AED', 2) : ' · one lot')

    : 'AED ' + nf(raw.packing, 2) + ' for the whole lot');

    ? '= <em>' + money(calc.airPKR) + '</em> · 1 USD = ' + nf(rates.USD, 4)

    ? '= <em>' + money(calc.seaPKR) + '</em> · 1 AFN = ' + nf(rates.AFN, 4)
    : 'Sea shipment in AFN');
}

function submitItemForm(form) {
  const raw = readItemInputs(form);
  const rates = { ...currentDraftRates(form) };
  const existing = form.dataset.edit === '1' ? state.items.find((i) => i.id === form.dataset.itemId) : null;
  if (!raw.name) return formError(form, 'f-name', 'Give this lot a name.');
  if (!(raw.boughtAED > 0)) return formError(form, 'f-buy', 'Enter the bought price per unit in AED.');
  if (!(raw.units >= 1)) return formError(form, 'f-units', 'Total units must be at least 1.');
  if (raw.packing < 0 || raw.airUSD < 0 || raw.seaAFN < 0 || raw.otherPKR < 0) return formError(form, 'f-pack', 'Costs cannot be negative.');
  if (existing) {
    const st = itemStats(existing);
    if (raw.units < st.soldQty) return formError(form, 'f-units', 'You already sold ' + st.soldQty + ' units from this lot.');
    Object.assign(existing, raw, { rates });
  } else {
    state.items.push({ id: uid('it'), createdAt: Date.now(), ...raw, rates });
  }
  if (!saveState()) return;
  closeAllModals();
  render();
  toast(existing ? '<b>Lot updated.</b> Past sales keep their saved P&L.' : '<b>Stock lot added.</b> Costed at the locked rates.', 'ok');
}

function syncBuyerUI(form) {
  const buyer = (form.querySelector('input[name="buyer"]:checked') || {}).value || 'walkin';
  const wrap = form.querySelector('#acct-wrap');
  if (wrap) wrap.hidden = buyer !== 'account';
  const sel = form.querySelector('#s-account');
  const hint = form.querySelector('#s-acc-hint');
  if (hint && sel) {
    const acc = accountById(sel.value);
    hint.innerHTML = acc ? 'Current balance <b>' + money(accountBalance(acc.id)) + '</b> — ' +
      (form.dataset.saleId ? 'the linked charge will be updated.' : 'this sale will be added as a charge.') : '';
  }
}

function updateSellCalc(form) {
  if (!form) return;
  const sale = form.dataset.saleId ? state.sales.find((s) => s.id === form.dataset.saleId) : null;
  const item = state.items.find((i) => i.id === form.dataset.itemId);
  if (!item) return;
  const st = itemStats(item);
  const otherSold = sale ? Math.max(0, st.soldQty - sale.qty) : st.soldQty;
  const available = Math.max(0, num(item.units) - otherSold);
  const qtyEl = form.querySelector('#s-qty');
  const qty = clamp(int(qtyEl.value), 0, available);
  const price = num((form.querySelector('#s-price') || {}).value);
  const cur = (form.querySelector('input[name="sellcur"]:checked') || {}).value || 'PKR';
  let rate = rateOf(cur);
  let rateLocked = false;
  if (sale && sale.cur === cur && cur !== 'PKR' && sale.totalCur > 0 && sale.totalPKR > 0) {
    rate = sale.totalPKR / sale.totalCur;
    rateLocked = true;
  }
  const unitPKR = price * rate;
  const totalCur = price * qty;
  const totalPKR = unitPKR * qty;
  const unitCost = sale ? (sale.costPKR || st.calc.unitPKR) : st.calc.unitPKR;
  const cost = unitCost * qty;
  const hasPrice = price > 0;
  const pnl = hasPrice ? totalPKR - cost : 0;
  const margin = hasPrice && totalPKR > 0 ? (pnl / totalPKR) * 100 : 0;
  const set = (id, text) => { const el = form.querySelector('#' + id); if (el) el.textContent = text; };
  set('s-qty-hint', sale
    ? st.remaining + ' in stock now · max ' + available + ' for this sale'
    : available + ' available · max ' + available);
  set('s-price-aux', cur === 'PKR'
    ? 'Cost ' + money2(unitCost) + ' / unit'
    : money2(unitPKR) + ' / unit in PKR · 1 ' + cur + ' = ' + nf(rate, 4) + ' PKR' + (rateLocked ? ' · locked at sale' : ''));
  set('s-total-cur', money(totalCur, cur, cur === 'PKR' ? 0 : 2));
  set('s-total-pkr', money(totalPKR));
  set('s-cost', money(cost));
  const pnlEl = form.querySelector('#s-pnl');
  if (pnlEl) {
    pnlEl.textContent = hasPrice ? (pnl < 0 ? '- ' : '') + money(Math.abs(pnl)) : 'PKR 0';
    pnlEl.className = 'pp-val ' + (hasPrice ? (pnl < 0 ? 'down' : pnl > 0 ? 'up' : '') : '');
  }
  const mEl = form.querySelector('#s-margin');
  if (mEl) mEl.textContent = hasPrice
    ? (margin >= 0 ? '+' : '') + nf(margin, 1) + '% margin' + (qty > 0 ? ' · ' + qty + ' units' : '')
    : 'Enter a selling price';
}

  const sale = form.dataset.saleId ? state.sales.find((s) => s.id === form.dataset.saleId) : null;
  const item = state.items.find((i) => i.id === form.dataset.itemId);
  if (!item) { toast('This lot no longer exists.', 'err'); return; }
  const st = itemStats(item);
  const otherSold = sale ? Math.max(0, st.soldQty - sale.qty) : st.soldQty;
  const available = Math.max(0, num(item.units) - otherSold);
  const qty = int((form.querySelector('#s-qty') || {}).value);
  const price = num((form.querySelector('#s-price') || {}).value);
  const cur = (form.querySelector('input[name="sellcur"]:checked') || {}).value || 'PKR';
  const date = (form.querySelector('#s-date') || {}).value || todayISO();
  const buyerType = (form.querySelector('input[name="buyer"]:checked') || {}).value || 'walkin';
  const accountId = buyerType === 'account' ? (form.querySelector('#s-account') || {}).value : null;
  const note = ((form.querySelector('#s-note') || {}).value || '').trim();
  if (!(qty >= 1)) return formError(form, 's-qty', 'Quantity must be at least 1.');
  if (qty > available) return formError(form, 's-qty', sale
    ? 'Only ' + available + ' units can be assigned to this sale.'
    : 'Only ' + available + ' units are left in stock.');
  if (!(price > 0)) return formError(form, 's-price', 'Enter a selling price.');
  if (buyerType === 'account' && !accountId) return formError(form, 's-account', 'Choose a customer account.');
  const acc = accountId ? accountById(accountId) : null;
  let rate = rateOf(cur);
  if (sale && sale.cur === cur && cur !== 'PKR' && sale.totalCur > 0 && sale.totalPKR > 0) {
    rate = sale.totalPKR / sale.totalCur;
  }
  const totalCur = price * qty;
  const totalPKR = price * rate * qty;
  const costPKR = sale ? (sale.costPKR || st.calc.unitPKR) : st.calc.unitPKR;
  const pnlPKR = totalPKR - costPKR * qty;
  const chargeDetails = 'Sale — ' + item.name + ' × ' + qty;

  if (sale) {
    Object.assign(sale, {
      itemName: item.name, date, qty, cur, unitPrice: price, totalCur, totalPKR,
      costPKR, pnlPKR, buyerType, accountId: acc ? acc.id : null,
      accountName: acc ? acc.name : '', note
    });
    const linked = state.ledger.filter((e) => e.refSaleId === sale.id);
    if (acc) {
      const charge = linked[0];
      if (charge) {
        charge.accountId = acc.id;
        charge.date = date;
        charge.ts = Date.now();
        charge.type = 'charge';
        charge.amountPKR = totalPKR;
        charge.cur = 'PKR';
        charge.amount = totalPKR;
        charge.details = chargeDetails;
        if (linked.length > 1) state.ledger = state.ledger.filter((e) => e.refSaleId !== sale.id || e.id === charge.id);
      } else {
        state.ledger.push({
          id: uid('le'), accountId: acc.id, date, ts: Date.now(), type: 'charge',
          amountPKR: totalPKR, cur: 'PKR', amount: totalPKR,
          details: chargeDetails, refSaleId: sale.id
        });
      }
    } else {
      state.ledger = state.ledger.filter((e) => e.refSaleId !== sale.id);
    }
    if (!saveState()) return;
    closeAllModals();
    render();
    toast('<b>Sale updated.</b> P&amp;L ' + (pnlPKR >= 0 ? '+ ' : '- ') + money(Math.abs(pnlPKR)) +
      (acc ? ' · charged to ' + esc(acc.name) : ' · walk-in'), pnlPKR >= 0 ? 'ok' : 'info');
    return;
  }

  const newPkr = price * rate;
  const saleTotalPKR = newPkr * qty;
  const newPnl = saleTotalPKR - costPKR * qty;
  const created = {
    id: uid('sl'), itemId: item.id, itemName: item.name, date, qty, cur,
    unitPrice: price, totalCur, totalPKR: saleTotalPKR, costPKR, pnlPKR: newPnl,
    buyerType, accountId: acc ? acc.id : null, accountName: acc ? acc.name : '',
    note, ts: Date.now()
  };
  state.sales.push(created);
  if (acc) {
    state.ledger.push({
      id: uid('le'), accountId: acc.id, date, ts: Date.now(), type: 'charge',
      amountPKR: saleTotalPKR, cur: 'PKR', amount: saleTotalPKR,
      details: chargeDetails, refSaleId: created.id
    });
  }
  if (!saveState()) return;
  closeAllModals();
  render();
  toast('<b>Sale saved.</b> P&amp;L ' + (newPnl >= 0 ? '+ ' : '- ') + money(Math.abs(newPnl)) +
    (acc ? ' · charged to ' + esc(acc.name) : ' · walk-in'), newPnl >= 0 ? 'ok' : 'info');
}

function updateEntryCalc(form) {
  if (!form) return;
  const amount = num((form.querySelector('#e-amount') || {}).value);
  const cur = (form.querySelector('input[name="ecur"]:checked') || {}).value || 'PKR';
  const type = (form.querySelector('input[name="etype"]:checked') || {}).value || 'credit';
  const id = form.dataset.accountId;
  const bal = accountBalance(id);
  const pkr = toPKR(amount, cur);
  const after = bal + (type === 'credit' ? pkr : -pkr);
  const set = (key, text) => { const el = form.querySelector('#' + key); if (el) el.textContent = text; };
  set('e-cur-hint', cur);
  const accBalEl = form.querySelector('#e-acc-bal');
  if (accBalEl) accBalEl.innerHTML = moneyIn(bal, cur) + '<small>balance</small>';
  set('e-amount-cur', money(amount, cur, cur === 'PKR' ? 0 : 2));
  set('e-pkr', money(pkr));
  set('e-bal', moneyIn(bal, cur));
  set('e-after', moneyIn(after, cur));
  set('e-effect', type === 'credit' ? 'Credit increases the balance' : 'Debit reduces the balance');
  const afterEl = form.querySelector('#e-after');
  if (afterEl) afterEl.className = 'pp-val ' + (after > 0.5 ? 'up' : after < -0.5 ? 'down' : '');
}

function submitRateForm(form) {
  const cur = form.dataset.rateForm;
  if (!META[cur]) return;
  const rate = num((form.querySelector('input[name="rate"]') || {}).value);
  const date = (form.querySelector('input[name="date"]') || {}).value || todayISO();
  if (!(rate > 0)) { toast('Enter a rate greater than zero.', 'err'); return; }
  if (Math.abs(rate - state.rates[cur]) < 1e-9) { toast('That is already the current ' + cur + ' rate.', 'info'); return; }
  const old = state.rates[cur];
  state.rates[cur] = rate;
  state.rateHistory.push({ id: uid('rt'), ts: Date.now(), date, cur, rate, old, note: 'Manual update' });
  if (!saveState()) return;
  render();
  toast('<b>' + cur + ' updated.</b> 1 ' + cur + ' = ' + nf(rate, 4) + ' PKR · saved to history', 'ok');
}

/* ---------------- delete flows ---------------- */
function deleteItemFlow(id) {
  const item = state.items.find((i) => i.id === id);
  if (!item) return;
  const st = itemStats(item);
  if (st.soldQty > 0) {
    toast('This lot has ' + st.soldQty + ' sold units. Delete those stock-out records first.', 'err');

  }
  openConfirm({
    title: 'Delete lot?',
    body: 'Delete <b>' + esc(item.name) + '</b> and its cost breakdown? This cannot be undone.',
    cta: 'Delete lot',
    danger: true,
    onConfirm() {
      state.items = state.items.filter((i) => i.id !== id);
      saveState();
      closeAllModals();
      render();
      toast('Lot deleted.', 'info');
    }
  });
}

function deleteSaleFlow(id) {
  const sale = state.sales.find((s) => s.id === id);
  if (!sale) return;
  openConfirm({
    title: 'Delete sale?',
    body: 'Delete the sale of <b>' + esc(sale.itemName) + '</b> (' + sale.qty + ' units)?<br>Stock returns to the lot and any linked account charge is removed.',
    cta: 'Delete sale',
    danger: true,
    onConfirm() {
      state.sales = state.sales.filter((s) => s.id !== id);
      state.ledger = state.ledger.filter((e) => e.refSaleId !== id);
      saveState();
      closeAllModals();
      render();
      toast('Sale deleted. Stock restored.', 'info');
    }
  });
}

function deleteAccountFlow(id) {
  const acc = accountById(id);
  if (!acc) return;
  const n = state.ledger.filter((e) => e.accountId === id).length;
  openConfirm({
    title: 'Delete account?',
    body: 'Delete <b>' + esc(acc.name) + '</b>' + (n ? ' and its <b>' + n + '</b> ledger entries' : '') + '?<br>Past sales stay in Stock out, but the credit record will be removed.',
    cta: 'Delete account',
    danger: true,
    onConfirm() {
      state.accounts = state.accounts.filter((a) => a.id !== id);
      state.ledger = state.ledger.filter((e) => e.accountId !== id);
      state.sales.forEach((s) => { if (s.accountId === id) s.accountId = null; });
      saveState();
      closeAllModals();
      if (getRoute().view === 'account') {
        location.hash = '#/accounts';
        render();
      } else render();
      toast('Account deleted.', 'info');
    }
  });
}

function deleteEntryFlow(id) {
  const e = state.ledger.find((x) => x.id === id);
  if (!e) return;
  const acc = accountById(e.accountId);
  openConfirm({
    title: 'Delete entry?',
    body: 'Remove <b>' + esc(e.details || 'this entry') + '</b> (' + money(e.amountPKR) + ') from ' + esc(acc ? acc.name : 'the ledger') + '?',

    '<div class="data-note">A backup is a JSON file with your rates, history, lots, sales, accounts and ledger. Keep one somewhere safe — clearing browser data erases this app’s storage.</div>' +
    '<div class="data-danger"><button class="btn danger" data-action="reset-data">' + icon('trash') + ' Erase all data</button></div>' +
    '<div class="data-note" style="display:flex;justify-content:space-between"><span>Local storage used</span><span class="mono">' + nf(bytes / 1024, 1) + ' KB</span></div>';
  openModal(modalShell({
    title: 'Backup & data', sub: 'Everything lives in this browser, on this device.',
    cls: 'narrow', body,
    footer: '<button type="button" class="btn ghost" data-action="close-modal">Close</button>'
  }), {
    onMount(ov) {
      const file = ov.querySelector('#import-file');
      if (file) file.addEventListener('change', () => {
        const f = file.files && file.files[0];
        if (f) handleImportFile(f);
        file.value = '';
      });
    }
  });
}

function exportData() {
  const payload = { app: 'Aqil Computers Inventory OS', exportedAt: new Date().toISOString(), ...state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aqil-computers-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Backup downloaded.', 'ok');
}

function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch (e) { toast('That file is not valid JSON.', 'err'); return; }
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.items) || !Array.isArray(parsed.sales) ||
      !Array.isArray(parsed.accounts) || !Array.isArray(parsed.ledger) || !parsed.rates) {
      toast('This is not an Aqil Computers backup file.', 'err');
      return;
    }
    const counts = parsed.items.length + ' lots, ' + parsed.sales.length + ' sales, ' + parsed.accounts.length + ' accounts';
    openConfirm({
      title: 'Replace all data?',
      body: 'Import <b>' + esc(file.name) + '</b> (' + counts + ').<br>This replaces everything currently saved in this browser.',
      cta: 'Import backup', danger: true,
      onConfirm() {
        state = normalizeState(parsed);
        ui.accCur = 'PKR';
        if (!saveState()) return;
        closeAllModals();
        if (location.hash && location.hash !== '#/dashboard') location.hash = '#/dashboard';
        render();
        toast('<b>Backup imported.</b> ' + counts, 'ok');
      }
    });
  };
  reader.onerror = () => toast('Could not read that file.', 'err');
  reader.readAsText(file);
}

function resetAllData() {
  openConfirm({
    title: 'Erase everything?',
    body: 'All lots, sales, accounts, ledger entries and rate history will be permanently removed from this browser.',
    warning: 'Export a backup first if you might need this data.',
    cta: 'Erase all data', danger: true,
    onConfirm() {
      state = blankState();
      saveState();
      ui.accCur = 'PKR'; ui.stockFilter = 'all'; ui.stockQuery = ''; ui.salesQuery = ''; ui.accQuery = ''; ui.histFilter = 'all';
      closeAllModals();
      if (location.hash !== '#/dashboard') location.hash = '#/dashboard';
      render();
      toast('All data erased. Rates reset to opening values.', 'info');
    }
  });
}

    openConfirm({
      title: 'Load demo workspace?',
      body: 'This replaces the current lots, sales and accounts with a sample shop. Export a backup first if needed.',
      cta: 'Load demo', danger: true,
      onConfirm() {
        seedDemo();
        closeAllModals();

        toast('<b>Demo workspace loaded.</b> Clear it anytime from Backup & data.', 'ok');

/* ---------------- theme ---------------- */
const THEME_KEY = 'aqil_theme_v1';
const THEME_OPTIONS = ['dark', 'light', 'system'];
let themePref = 'dark';

function storedThemePref() {
  try {
    const t = localStorage.getItem(THEME_KEY);
    return THEME_OPTIONS.includes(t) ? t : 'dark';
  } catch (e) {
    return 'dark';
  }
}
function resolvedTheme(pref) {
  if (pref === 'system') {
    try { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
    catch (e) { return 'dark'; }
  }
  return pref === 'light' ? 'light' : 'dark';
}
function applyTheme(pref, persist) {
  themePref = THEME_OPTIONS.includes(pref) ? pref : 'dark';
  if (persist !== false) {
    try { localStorage.setItem(THEME_KEY, themePref); } catch (e) { /* storage blocked */ }
  }
  const theme = resolvedTheme(themePref);
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.colorScheme = theme;
  const meta = document.getElementById('theme-meta');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#e8eef6' : '#060a10');
  updateThemeUI();
}
function updateThemeUI() {
  const theme = resolvedTheme(themePref);
  const btn = $('#theme-toggle');
  if (btn) {
    const light = theme === 'light';
    btn.innerHTML = icon(light ? 'moon' : 'sun');
    btn.title = light ? 'Switch to dark theme' : 'Switch to light theme';
    btn.setAttribute('aria-label', btn.title);
  }
  $$('[data-theme-opt]').forEach((b) => b.classList.toggle('active', b.dataset.theme === themePref));
}
function toggleTheme() {
  applyTheme(resolvedTheme(themePref) === 'light' ? 'dark' : 'light');
}

/* ---------------- routing / rendering ---------------- */
const VIEWS = {
  dashboard: viewDashboard,
  stock: viewStock,
  sales: viewSales,
  accounts: viewAccounts,
  rates: viewRates
};
const VIEW_LABELS = {
  dashboard: 'overview', stock: 'stock', sales: 'stock out',
  accounts: 'accounts', account: 'ledger', rates: 'rates'
};

function getRoute() {
  const raw = String(location.hash || '').replace(/^#\/?/, '').split('?')[0];
  const parts = raw.split('/').filter(Boolean);
  const head = parts[0] || 'dashboard';
  if ((head === 'accounts' || head === 'account') && parts[1]) return { view: 'account', id: parts[1] };
  if (!VIEWS[head]) return { view: 'dashboard', id: null };
  return { view: head, id: null };
}

function render() {
  let route = getRoute();
  if (route.view === 'account' && !accountById(route.id)) {
    if (location.hash !== '#/accounts') { location.hash = '#/accounts'; return; }
    route = { view: 'accounts', id: null };
  }
  const view = $('#view');
  if (!view) return;
  view.innerHTML = route.view === 'account' ? viewAccount(route.id) : VIEWS[route.view]();

  document.body.classList.toggle('on-ledger', route.view === 'account');
  const activeNav = route.view === 'account' ? 'accounts' : route.view;
  $$('[data-nav]').forEach((el) => el.classList.toggle('active', el.dataset.nav === activeNav));
  const sc = $('#nav-stock-count');
  if (sc) sc.textContent = state.items.length;
  const ac = $('#nav-acc-count');
  if (ac) ac.textContent = state.accounts.length;
  const pv = $('#path-view');
  if (pv) pv.textContent = VIEW_LABELS[route.view] || 'overview';
  document.title = 'Aqil Computers — ' + (VIEW_LABELS[route.view] || 'overview');
  renderRailRates();
  updateFab(route);
}

function renderRailRates() {
  const el = $('#rail-rates');
  if (!el) return;
  el.innerHTML = ['AED', 'AFN', 'USD'].map((cur) =>
    '<div class="rate-row"><i class="dot" style="background:' + META[cur].color + ';color:' + META[cur].color + '"></i>' +
    '<span class="unit">' + cur + '</span><b>' + nf(state.rates[cur], 4) + '</b></div>').join('');
}

function updateFab(route) {
  const fab = $('#fab');
  if (!fab) return;
  fab.classList.toggle('fab-sale', route.view === 'sales');
  if (route.view === 'stock') {
    fab.hidden = false;
    fab.dataset.action = 'new-item';
    fab.setAttribute('aria-label', 'Add a new stock item');
    fab.innerHTML = icon('plus') + '<span>New item</span>';
  } else if (route.view === 'accounts') {
    fab.hidden = false;
    fab.dataset.action = 'new-account';
    fab.setAttribute('aria-label', 'Add a new account');
    fab.innerHTML = icon('plus') + '<span>New account</span>';
  } else if (route.view === 'sales') {
    fab.hidden = false;
    fab.dataset.action = 'new-sale';
    fab.setAttribute('aria-label', 'Record a sale');
    fab.innerHTML = icon('plus') + '<span>Record sale</span>';
  } else if (route.view === 'account') {
    fab.hidden = true;
    fab.removeAttribute('data-id');
  } else {
    fab.hidden = true;
    fab.removeAttribute('data-id');
  }
}

function rerenderSearch(id) {
  const before = $('#' + id);
  const pos = before && before.selectionStart != null ? before.selectionStart : 0;
  render();
  const after = $('#' + id);
  if (after) {
    try {
      after.focus({ preventScroll: true });
      after.setSelectionRange(pos, pos);
    } catch (e) { /* noop */ }
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const hrefEl = e.target.closest('[data-href]');
  if (hrefEl && !e.target.closest('button, a, input, select, textarea')) {
    location.hash = hrefEl.dataset.href;
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch (action) {
    case 'close-modal': closeModal(); break;
    case 'new-item': closeAllModals(); openItemModal(); break;
    case 'open-item': openItemDetail(id); break;
    case 'edit-sale': {
      const sl = state.sales.find((s) => s.id === id);
      if (sl) { closeAllModals(); openSellModal(sl.itemId, sl.id); }
      break;
    }
    case 'edit-item': closeAllModals(); openItemModal(id); break;
    case 'delete-item': deleteItemFlow(id); break;
    case 'sell': closeAllModals(); openSellModal(id); break;
    case 'new-sale': closeAllModals(); openSalePicker(); break;
    case 'pick-sale': closeAllModals(); openSellModal(id); break;
    case 'new-account': closeAllModals(); openAccountModal(); break;
    case 'edit-account': openAccountModal(id); break;
    case 'delete-account': deleteAccountFlow(id); break;
    case 'add-entry': openEntryModal(id, el.dataset.entryType || 'credit'); break;
    case 'del-entry': deleteEntryFlow(id); break;
    case 'delete-sale': deleteSaleFlow(id); break;
    case 'set-acc-cur': ui.accCur = el.dataset.cur || 'PKR'; render(); break;
    case 'filter-stock': ui.stockFilter = el.dataset.filter || 'all'; render(); break;
    case 'filter-hist': ui.histFilter = el.dataset.cur || 'all'; render(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'set-theme': applyTheme(el.dataset.theme || 'dark'); break;
    case 'open-data': openDataModal(); break;
    case 'check-update': checkForUpdates({}); break;
    case 'update-available': showUpdateSheet(); break;
    case 'reload-app': reloadApp(); break;
    case 'restart-app': closeAllModals(); location.reload(); break;
    case 'download-apk': openExternal(el.dataset.url); break;
    case 'export-data': exportData(); break;
    case 'import-data': { const f = $('#import-file'); if (f) f.click(); break; }
    case 'reset-data': resetAllData(); break;
    case 'demo-data': loadDemoFlow(); break;
    case 'qty-step': {
      const form = el.closest('form');
      const input = form && form.querySelector('#s-qty');
      if (input) {
        const max = int(input.max) || 999999;
        input.value = clamp(int(input.value) + num(el.dataset.delta), 1, max);
        updateSellCalc(form);
      }
      break;
    }
    default: break;
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target;
  if (!form || !form.id && !form.dataset.rateForm) return;
  if (form.id === 'item-form') { e.preventDefault(); submitItemForm(form); return; }
  if (form.id === 'sell-form') { e.preventDefault(); submitSellForm(form); return; }
  if (form.id === 'account-form') { e.preventDefault(); submitAccountForm(form); return; }
  if (form.id === 'entry-form') { e.preventDefault(); submitEntryForm(form); return; }
  if (form.dataset.rateForm) { e.preventDefault(); submitRateForm(form); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'stock-search') { ui.stockQuery = e.target.value; rerenderSearch('stock-search'); return; }
  if (e.target.id === 'sales-search') { ui.salesQuery = e.target.value; rerenderSearch('sales-search'); return; }
  if (e.target.id === 'acc-search') { ui.accQuery = e.target.value; rerenderSearch('acc-search'); return; }
  if (e.target.id === 'ledger-search') { ui.ledgerQuery = e.target.value; rerenderSearch('ledger-search'); return; }
  const itemForm = e.target.closest('#item-form');
  if (itemForm) { updateItemCalc(itemForm); return; }
  const sellForm = e.target.closest('#sell-form');
  if (sellForm) { updateSellCalc(sellForm); return; }
  const entryForm = e.target.closest('#entry-form');
  if (entryForm) updateEntryCalc(entryForm);
});

document.addEventListener('change', (e) => {
  const itemForm = e.target.closest('#item-form');
  if (itemForm) updateItemCalc(itemForm);
  const sellForm = e.target.closest('#sell-form');
  if (sellForm) {
    updateSellCalc(sellForm);
    if (e.target.name === 'buyer' || e.target.id === 's-account') syncBuyerUI(sellForm);
  }
  const entryForm = e.target.closest('#entry-form');
  if (entryForm) updateEntryCalc(entryForm);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalStack.length) {
    e.preventDefault();
    closeModal();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    const hrefEl = e.target.closest && e.target.closest('[data-href]');
    if (hrefEl) {
      e.preventDefault();
      location.hash = hrefEl.dataset.href;
      return;
    }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-action]')) {
    e.preventDefault();
    e.target.click();
  }
});

window.addEventListener('hashchange', () => {
  render();
  closeAllModals();
  window.scrollTo(0, 0);
});

/* ---------------- boot ---------------- */
state = loadState();
saveState();
themePref = storedThemePref();
applyTheme(themePref, false);
try {
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onChange = () => { if (themePref === 'system') applyTheme('system', false); };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
} catch (e) { /* noop */ }
render();
initUpdates();
window.__AQIL_APP_READY__ = true;
try {
  const shell = nativeShell();
  if (shell && typeof shell.ready === 'function') shell.ready();
} catch (e) { /* noop */ }

</script>
